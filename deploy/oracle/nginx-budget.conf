# Budget Track's site in progress-dashboard's nginx container. deploy.sh copies this file into the running container
# as /etc/nginx/conf.d/budget.conf (DOMAIN_PLACEHOLDER replaced) and connects nginx to the "edge" network.
#
# The upstream is a variable resolved per request through Docker's DNS, so nginx still starts (and progress-dashboard
# stays up) even while the budget containers are down.

server {
    listen 80;
    server_name DOMAIN_PLACEHOLDER;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name DOMAIN_PLACEHOLDER;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_PLACEHOLDER/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $budget_upstream http://budget:3000;

    location / {
        proxy_pass $budget_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
