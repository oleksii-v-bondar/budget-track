# Local development and self-hosting: the app plus Postgres 16.
# Copy .env.example to .env and fill in the secrets first.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: budget
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U budget -d budget']
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://budget:${POSTGRES_PASSWORD}@db:5432/budget
      APP_USERNAME: ${APP_USERNAME:?set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional bank connections (README "Bank connections (Enable Banking)"): off while the app id is empty or
      # ./secrets/enablebanking.pem is missing (read as /app/secrets/enablebanking.pem, the default key file).
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID:-}
      BANK_REDIRECT_URI: ${BANK_REDIRECT_URI:-http://localhost:${APP_PORT:-3000}/api/bank/callback}
    volumes:
      - ./secrets:/app/secrets:ro
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'

volumes:
  pgdata:
