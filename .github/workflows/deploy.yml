name: Deploy

# Deploys to the Oracle VM next to progress-dashboard (deploy/oracle/README.md). The repo is private, so the code is
# copied over SSH instead of cloned on the VM.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the code
        run: git archive --format=tar.gz -o budget-track.tgz HEAD

      - name: Copy it to the VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: budget-track.tgz
          target: /tmp

      - name: Deploy on the VM
        uses: appleboy/ssh-action@v1
        env:
          DOMAIN: budget-track.duckdns.org
          APP_USERNAME: ${{ secrets.APP_USERNAME }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          ENABLE_BANKING_APP_ID: ${{ secrets.ENABLE_BANKING_APP_ID }}
          ENABLE_BANKING_KEY: ${{ secrets.ENABLE_BANKING_KEY }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          envs: DOMAIN,APP_USERNAME,APP_PASSWORD,ENABLE_BANKING_APP_ID,ENABLE_BANKING_KEY
          script: |
            set -euo pipefail
            rm -rf /tmp/budget-track-src && mkdir -p /tmp/budget-track-src
            tar -xzf /tmp/budget-track.tgz -C /tmp/budget-track-src
            sudo mkdir -p /opt/budget-track
            sudo rsync -a --delete --exclude /.env --exclude /secrets/ /tmp/budget-track-src/ /opt/budget-track/
            rm -rf /tmp/budget-track-src /tmp/budget-track.tgz
            sudo --preserve-env=DOMAIN,APP_USERNAME,APP_PASSWORD,ENABLE_BANKING_APP_ID,ENABLE_BANKING_KEY \
              bash /opt/budget-track/deploy/oracle/deploy.sh
